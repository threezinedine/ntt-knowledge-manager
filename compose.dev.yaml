services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
  api:
    build:
      context: .
      target: server-development
    volumes:
      - ./server:/app/server
  web:
    build:
      context: .
      target: client-development
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
      - ./.dev.env:/app/client/.env
  component-tests:
    build:
      context: .
      target: client-development
    working_dir: /app/client
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    command: npm run test:component:watch
  storybook:
    build:
      context: .
      target: client-development
    ports:
      - "6006:6006"
    working_dir: /app/client
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    command: npm run storybook
  server-tests:
    build:
      context: .
      target: server-development
    working_dir: /app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./server:/app/server
      - ./.test.env:/app/.test.env
      - ./test-dashboard/run-server-tests.sh:/scripts/run-server-tests.sh:ro
      - ./test-dashboard/gen-server-report.sh:/scripts/gen-server-report.sh:ro
      - ./test-dashboard/gen-report.py:/scripts/gen-report.py:ro
      - ./test-results:/test-results
    command: sh /scripts/run-server-tests.sh
  client-tests:
    build:
      context: .
      target: client-development
    working_dir: /app/client
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
      - ./test-dashboard/run-client-tests.sh:/scripts/run-client-tests.sh:ro
      - ./test-dashboard/gen-client-report.sh:/scripts/gen-client-report.sh:ro
      - ./test-results:/test-results
    command: sh /scripts/run-client-tests.sh
  nginx-local:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-local
      - web-local
  api-local:
    build:
      context: .
      target: server-development
    volumes:
      - ./server:/app/server
      - ./.e2e.env:/app/.env
  web-local:
    build:
      context: .
      target: client-development
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
      - ./.e2e.env:/app/client/.env
  e2e-tests:
    build:
      context: .
      target: client-development
    working_dir: /app/e2e
    volumes:
      - ./e2e:/app/e2e
      - e2e_node_modules:/app/e2e/node_modules
      - playwright_browsers:/root/.cache/ms-playwright
      - ./test-dashboard/run-e2e-tests.sh:/scripts/run-e2e-tests.sh:ro
      - ./test-dashboard/gen-e2e-report.sh:/scripts/gen-e2e-report.sh:ro
      - ./test-results:/test-results
    depends_on:
      - nginx-local
    command: sh /scripts/run-e2e-tests.sh
  test-dashboard:
    build:
      context: .
      target: server-development
    ports:
      - "9090:9090"
    volumes:
      - ./test-dashboard:/app/test-dashboard:ro
      - ./test-results:/test-results
    command: python /app/test-dashboard/serve.py
    depends_on:
      - server-tests
      - client-tests

volumes:
  client_node_modules:
  e2e_node_modules:
  playwright_browsers:
