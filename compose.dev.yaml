services:
  api:
    build:
      context: .
      target: server-development
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
  web:
    build:
      context: .
      target: client-development
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
      - ./.dev.env:/app/client/.env