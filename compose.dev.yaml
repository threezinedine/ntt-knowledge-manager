services:
  api:
    build:
      context: .
      target: server-development
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
  web:
    build:
      context: .
      target: client-development
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
      - ./.dev.env:/app/client/.env
  component-tests:
    build:
      context: .
      target: client-development
    working_dir: /app/client
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    command: npm run test:component:watch
  storybook:
    build:
      context: .
      target: client-development
    ports:
      - "6006:6006"
    working_dir: /app/client
    volumes:
      - ./client:/app/client
      - client_node_modules:/app/client/node_modules
    command: npm run storybook
  server-tests:
    build:
      context: .
      target: server-development
    working_dir: /app
    environment:
      # bind-mounted volumes don't reliably emit inotify events
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./server:/app/server
      - ./.test.env:/app/.test.env
    command: python -m watchfiles --filter python 'python -m pytest server/tests --color=yes' server

volumes:
  client_node_modules: