services:
  api:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
  web:
    build:
      context: .
      target: client-development
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules